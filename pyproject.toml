[project]
name = "perehotelka-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20,<1",
    "APScheduler>=3.10,<4",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "greenlet>=3.0,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
